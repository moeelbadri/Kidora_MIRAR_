# Cache public assets only. Never apply a public cache policy to PHP/HTML sessions.
<Directory /var/www/html/assets>
    <FilesMatch "\.(css|js)$">
        Header set Cache-Control "public, max-age=0, must-revalidate"
    </FilesMatch>
    <FilesMatch "\.(png|jpe?g|webp|gif|svg|ico|woff2?|mp4|webm|mp3|ogg)$">
        Header set Cache-Control "public, max-age=86400"
    </FilesMatch>
</Directory>
<Directory /var/www/html/assets/videos/derived>
    <FilesMatch "\.(mp4|webp)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
</Directory>
